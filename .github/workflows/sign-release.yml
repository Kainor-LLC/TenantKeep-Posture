# Signs a tagged release through Azure Artifact Signing (formerly Trusted Signing) and attaches the signed package to
# its draft release. Microsoft issues and holds the certificate in its HSM; this workflow gets a short-lived token
# through OpenID Connect, so no certificate, secret or key ever exists as a file, here or anywhere. The run waits for
# a maintainer's approval on the "release" environment before it starts. Windows runner because Authenticode signing
# and verification are Windows-only. One-time setup: deploy/release/New-PostureSigningIdentity.ps1.
name: Sign release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to sign, for example v0.1.0-alpha. The draft release must already exist.
        required: true
        type: string

permissions:
  id-token: write
  contents: write

jobs:
  sign:
    name: Sign through Azure Artifact Signing
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install build dependencies
        shell: pwsh
        run: Install-PSResource -Name Microsoft.Graph.Authentication -Version '[2.0.0,)' -Scope CurrentUser -TrustRepository -Quiet

      - name: Tag matches the manifest
        id: version
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          $data = Import-PowerShellDataFile -Path ./TenantKeep.Posture/TenantKeep.Posture.psd1
          $version = [string]$data.ModuleVersion
          $pre = [string]$data.PrivateData.PSData.Prerelease
          $expected = "v$version$(if ($pre) { "-$pre" })"
          if ($tag -ne $expected) { throw "Tag $tag does not match the manifest at that tag, which says $expected." }
          "module=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Signing $expected"

      - name: Azure sign-in through OpenID Connect
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Stage the module
        shell: pwsh
        run: ./build.ps1 -Task Build -SkipInstall

      - name: Sign every staged script, module and manifest
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out\TenantKeep.Posture
          files-folder-filter: ps1,psm1,psd1
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify the signatures, write the integrity manifest, package
        shell: pwsh
        run: ./build.ps1 -Task Verify, Integrity, Package -SkipInstall -VaultName '${{ secrets.LICENCE_VAULT }}' -KeyName '${{ secrets.LICENCE_KEY }}'

      - name: Attach the signed package to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zip = "./out/TenantKeep.Posture-${{ steps.version.outputs.module }}.zip"
          gh release upload '${{ inputs.tag }}' $zip "$zip.sha256" --clobber
          Write-Host "Attached $(Split-Path $zip -Leaf) and its SHA-256 to ${{ inputs.tag }}. Publish the draft when ready."
