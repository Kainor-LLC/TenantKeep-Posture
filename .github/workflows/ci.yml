name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:00 UTC: a fresh install of the newest analyzer, Pester and Graph modules, so a dependency
    # change breaks here before it breaks a customer. The cache is skipped on this run on purpose.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Cache PowerShell modules
        if: github.event_name != 'schedule'
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~/Documents/PowerShell/Modules' || '~/.local/share/powershell/Modules' }}
          # Bump the suffix to force a fresh install everywhere.
          key: psmodules-${{ runner.os }}-1

      - name: Install build dependencies
        shell: pwsh
        run: |
          # The Gallery answers runners with an intermittent 404; retry before failing the run.
          function Install-WithRetry([string] $Name, [string] $Version) {
            for ($i = 1; $i -le 4; $i++) {
              try { Install-PSResource -Name $Name -Version $Version -Scope CurrentUser -TrustRepository -Quiet -ErrorAction Stop; return }
              catch { if ($i -eq 4) { throw }; Write-Warning "Install of $Name failed (attempt $i, retrying in $(15 * $i)s): $($_.Exception.Message)"; Start-Sleep -Seconds (15 * $i) }
            }
          }
          Install-WithRetry PSScriptAnalyzer '[1.22.0,)'
          Install-WithRetry Pester '[5.5.0,)'
          Install-WithRetry Microsoft.Graph.Authentication '[2.0.0,)'
          Get-Module -ListAvailable PSScriptAnalyzer, Pester, Microsoft.Graph.Authentication | Format-Table Name, Version

      - name: Secret scan of the whole tree
        shell: pwsh
        run: |
          . ./.githooks/Test-StagedSecrets.ps1
          $files = git ls-files | Where-Object { $_ -ne '.githooks/Test-StagedSecrets.ps1' }
          $hits = foreach ($f in $files) { Test-PostureStagedContent -Path $f -Content (Get-Content -Raw -LiteralPath $f -ErrorAction SilentlyContinue) }
          if ($hits) { $hits | Format-Table | Out-String | Write-Host; throw 'Secret scan failed.' }

      - name: Analyze and test
        shell: pwsh
        run: ./build.ps1 -Task Analyze, Test -SkipInstall

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: out/test-results.xml

  build:
    name: Build (unsigned, no package)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache PowerShell modules
        if: github.event_name != 'schedule'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/powershell/Modules
          key: psmodules-${{ runner.os }}-1
      - name: Install build dependencies
        shell: pwsh
        run: |
          # The Gallery answers runners with an intermittent 404; retry before failing the run.
          function Install-WithRetry([string] $Name, [string] $Version) {
            for ($i = 1; $i -le 4; $i++) {
              try { Install-PSResource -Name $Name -Version $Version -Scope CurrentUser -TrustRepository -Quiet -ErrorAction Stop; return }
              catch { if ($i -eq 4) { throw }; Write-Warning "Install of $Name failed (attempt $i, retrying in $(15 * $i)s): $($_.Exception.Message)"; Start-Sleep -Seconds (15 * $i) }
            }
          }
          Install-WithRetry Microsoft.Graph.Authentication '[2.0.0,)'
      - name: Stage module and render the catalog page
        shell: pwsh
        run: ./build.ps1 -Task Build, Catalog -SkipInstall
      - name: Confirm Package refuses to run without a certificate
        shell: pwsh
        run: |
          try { ./build.ps1 -Task Package -SkipInstall; throw 'Package ran without a signing certificate.' }
          catch { if ($_.Exception.Message -notmatch 'No signing certificate') { throw } ; Write-Host "Refused as expected: $($_.Exception.Message)" }
      - name: Upload the catalog page
        uses: actions/upload-artifact@v7
        with:
          name: catalog
          path: |
            out/catalog.md
            out/catalog.html
